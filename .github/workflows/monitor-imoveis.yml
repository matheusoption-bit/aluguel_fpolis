name: Monitor imobiliario - piloto diario
on:
  push:
    branches: [feat/monitor-cloud-piloto-2026-11]
    paths:
      - "monitor_nuvem/**"
      - ".github/workflows/monitor-imoveis.yml"
  workflow_dispatch:
    inputs:
      limite_fontes:
        description: "Quantas fontes com site tentar (5 no piloto; ate 39)"
        required: false
        default: "5"
  schedule:
    # 11:00 UTC = 08:00 em America/Sao_Paulo (UTC-3)
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: monitor-imoveis-${ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_nuvem/requirements.txt
      - run: python -m pip install -r monitor_nuvem/requirements.txt
      - run: python -m unittest discover -s monitor_nuvem/tests -v

  coletar:
    needs: testes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONITOR_LIMIT: ${ inputs.limite_fontes || '5' }}
      GOOGLE_SHEET_ID: ${ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_nuvem/requirements.txt
      - run: python -m pip install -r monitor_nuvem/requirements.txt
      - name: Restaurar historico incremental
        uses: actions/cache/restore@v4
        with:
          path: monitor_nuvem/state
          key: monitor-nuvem-${ github.run_id }}-${ github.run_attempt }}
          restore-keys: |
            monitor-nuvem-
      - name: Executar monitor
        run: python monitor_nuvem/monitor.py --limit "$MONITOR_LIMIT" --max-details 8
      - name: Salvar historico incremental
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor_nuvem/state
          key: monitor-nuvem-${ github.run_id }}-${ github.run_attempt }}
      - name: Publicar relatorios do dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-imobiliario-${ github.run_id }}
          path: monitor_nuvem/out/
          if-no-files-found: warn
          retention-days: 14
