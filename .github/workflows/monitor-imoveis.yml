name: Monitor imobiliario - piloto diario
on:
  push:
    branches: [feat/monitor-cloud-piloto-2026-11, feat/sync-sheets-cobertura-2026-11, feat/planilha-segredos-zero-2026-11]
    paths:
      - "monitor_nuvem/**"
      - ".github/workflows/monitor-imoveis.yml"
  workflow_dispatch:
    inputs:
      limite_fontes:
        description: "Quantas fontes com site tentar (5 no piloto; ate 39)"
        required: false
        default: "5"
  schedule:
    # 11:17 UTC = 08:17 em America/Sao_Paulo (UTC-3); reduz atrasos no GitHub
    - cron: "17 11 * * *"

permissions:
  contents: write

concurrency:
  group: monitor-imoveis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_nuvem/requirements.txt
      - run: python -m pip install -r monitor_nuvem/requirements.txt
      - run: python -m unittest discover -s monitor_nuvem/tests -v

  coletar:
    needs: testes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/monitor-cloud-piloto-2026-11')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONITOR_LIMIT: ${{ github.event_name == 'push' && '5' || inputs.limite_fontes || '5' }}
      MAX_DETAILS: ${{ github.event_name == 'push' && '2' || '8' }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_nuvem/requirements.txt
      - run: python -m pip install -r monitor_nuvem/requirements.txt
      - name: Restaurar historico incremental
        uses: actions/cache/restore@v4
        with:
          path: monitor_nuvem/state
          key: monitor-nuvem-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monitor-nuvem-
      - name: Executar monitor
        run: python monitor_nuvem/monitor.py --limit "$MONITOR_LIMIT" --max-details "$MAX_DETAILS"
      - name: Exportar anuncios publicos
        run: |
          python monitor_nuvem/public_export.py \
            --catalog monitor_nuvem/out/catalogo.csv \
            --statuses monitor_nuvem/out/status_fontes.csv \
            --destination dados_publicos/
      - name: Publicar catalogo publico no GitHub
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_publicos/anuncios_publicos.csv dados_publicos/status_fontes.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar anuncios publicos da coleta diaria"
            git push origin HEAD:main
          fi
      - name: Salvar historico incremental
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor_nuvem/state
          key: monitor-nuvem-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar relatorios do dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-imobiliario-${{ github.run_id }}
          path: monitor_nuvem/out/
          if-no-files-found: warn
          retention-days: 14
